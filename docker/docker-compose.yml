version: '3.8'

services:
  # Frontend
  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: ../docker/server.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/career_db
      - MONGODB_URI=mongodb+srv://lenkariteshkumar2005:B6NkQkTGJ1exEE4i@clustercareersoulmate.jqxh8yt.mongodb.net/careersoulmate?appName=ClusterCareerSoulmate
      - MONGODB_URL=mongodb+srv://lenkariteshkumar2005:B6NkQkTGJ1exEE4i@clustercareersoulmate.jqxh8yt.mongodb.net/careersoulmate?appName=ClusterCareerSoulmate
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
      - mongo

  # ML Services
  ml-recommender:
    build:
      context: ./ml
      dockerfile: ../docker/ml.Dockerfile
    ports:
      - "8001:8001"
    command: python recommender/service.py
    volumes:
      - ./ml:/app

  ml-dropout:
    build:
      context: ./ml
      dockerfile: ../docker/ml.Dockerfile
    ports:
      - "8002:8002"
    command: python dropout_predictor/service.py
    volumes:
      - ./ml:/app

  # Databases
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=career_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo:/docker-entrypoint-initdb.d

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - client
      - server

volumes:
  postgres_data:
  mongo_data:
